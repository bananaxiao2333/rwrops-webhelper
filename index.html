<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07080b" />
  <meta name="msvalidate.01" content="54BA2325E5CB082B8B1C1AC394CEC838" />
  <!--
    Opt out of machine translation. The site ships its own six locales, and its
    content is full of literal identifiers (setupHalloween2, processRewardPasses)
    that translation would mangle anyway. It is also a correctness issue: the
    translator rewrites text nodes in place, so React's fibre tree stops
    matching the real DOM and the next re-render throws
    "Failed to execute 'insertBefore' on 'Node'", which the visualization error
    boundary then reports as a render failure.
  -->
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>RWROPS — RWRWIKI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    #loading-screen {
      position: fixed; inset: 0; z-index: 99999;
      background: #07080b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader {
      max-width: 420px;
      width: 100%;
      padding: 0 24px;
      text-align: left;
    }

    .loader-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }

    .loader-titles {
      flex: 1;
      min-width: 0;
    }

    .loader-logo {
      width: 48px; height: 48px;
      flex-shrink: 0;
      opacity: 0;
      animation: loader-fade-in 0.5s ease 0.1s forwards;
    }

    .loader-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f2f6;
      line-height: 1.15;
      margin-bottom: 4px;
      opacity: 0;
      animation: loader-fade-in 0.5s ease 0.2s forwards;
    }

    .loader-subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 400;
      color: #555b6b;
      opacity: 0;
      animation: loader-fade-in 0.5s ease 0.3s forwards;
    }

    .loader-progress {
      opacity: 0;
      animation: loader-fade-in 0.5s ease 0.4s forwards;
    }

    .loader-progress-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .loader-stage {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(10px, 1.8vw, 12px);
      font-weight: 600;
      color: #f5a623;
      letter-spacing: 0.02em;
    }

    .loader-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 1.8vw, 12px);
      color: #555b6b;
    }

    .loader-pct-value {
      display: inline-block;
      min-width: 2ch;
      text-align: right;
    }

    .loader-track {
      width: 100%; height: 3px;
      background: #1b1e27;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%; width: 0%;
      background: #f5a623;
      transition: width 0.4s ease;
    }

    .loader-detail {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(9px, 1.6vw, 11px);
      color: #333845;
      margin-top: 12px;
      min-height: 1.4em;
      letter-spacing: 0.01em;
    }

    .loader-prompt {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(10px, 1.8vw, 12px);
      color: #555b6b;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #1b1e27;
    }

    .loader-prompt-label {
      color: #555b6b;
    }

    .loader-log {
      display: none;
    }

    @keyframes loader-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen { transition: opacity 0.2s linear; }
      .loader-logo, .loader-title, .loader-subtitle, .loader-progress {
        animation: none; opacity: 1;
      }
      .loader-fill { transition: width 0.1s linear; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <style>.skip-link{position:absolute;top:-100px;left:8px;z-index:100000;padding:8px 16px;background:#f5a623;color:#07080b;font-family:Inter,sans-serif;font-size:14px;font-weight:600;text-decoration:none;transition:top 0.2s ease}.skip-link:focus{top:0}</style>
  <div id="loading-screen" role="status" aria-label="Loading application">
    <div class="loader">
      <div class="loader-header">
        <div class="loader-titles">
          <div class="loader-title">RWROPS</div>
          <div class="loader-subtitle">Running With Rifles · Web Helper</div>
        </div>
        <img class="loader-logo" src="/icon.svg" alt="RWROPS" />
      </div>

      <div class="loader-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="loader-progress-header">
          <span class="loader-stage" id="stage-text">INITIALIZING</span>
          <span class="loader-pct">
            <span class="loader-pct-value" id="ring-pct">0</span>%
          </span>
        </div>
        <div class="loader-track">
          <div class="loader-fill" id="progress-bar"></div>
        </div>
        <div class="loader-detail" id="detail-text"></div>
      </div>

      <div class="loader-prompt">
        <span class="loader-prompt-label" id="prompt-label">Awaiting initialization</span>
      </div>

      <div class="loader-log" aria-hidden="true">
        <span id="log-1"></span>
        <span id="log-2"></span>
        <span id="log-3"></span>
        <span id="log-4"></span>
        <span id="log-5"></span>
      </div>
    </div>
  </div>

  <!-- React Mount -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
