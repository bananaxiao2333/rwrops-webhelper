<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080c12" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>RWROPS — Tactical Data Terminal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ════════════════════════════════════════════════
       RWROPS · Tactical Terminal Boot Sequence
       ════════════════════════════════════════════════ */

    :root {
      --bg-deep:       #080c12;
      --bg-surface:    #131a24;
      --bg-elevated:   #182233;
      --accent:        #f59e0b;
      --accent-glow:   rgba(245, 158, 11, 0.35);
      --accent-dim:    #b45309;
      --accent-faint:  rgba(245, 158, 11, 0.08);
      --success:       #22c55e;
      --text-primary:  #e8edf3;
      --text-muted:    #8899aa;
      --text-dim:      #3a4a5a;
      --border-subtle: #1e2d3d;
      --border-mid:    #2a3a4e;
      --font-display:  'Rajdhani', sans-serif;
      --font-mono:     'Share Tech Mono', monospace;
      --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
      --ease-smooth:   cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ════════════ LOADING SCREEN ════════════ */
    #loading-screen {
      position: fixed; inset: 0; z-index: 99999;
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.45s var(--ease-smooth),
                  visibility 0.45s var(--ease-smooth);
      animation: crt-flicker 4s ease-in-out 0.5s infinite;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      animation: none;
    }

    /* ── CRT vignette ── */
    #loading-screen::before {
      content: '';
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 50%,
        rgba(8, 12, 18, 0.55) 80%,
        rgba(8, 12, 18, 0.85) 100%
      );
    }

    /* ── Scanline overlay (animated downward drift) ── */
    #loading-screen::after {
      content: '';
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(245, 158, 11, 0.012) 3px,
        rgba(245, 158, 11, 0.012) 6px
      );
      animation: scanline-drift 8s linear infinite;
    }

    /* ── Noise grain overlay ── */
    .terminal-grain {
      position: absolute; inset: -50%; z-index: 1; pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
      animation: grain-shift 0.5s steps(3) infinite;
    }

    /* ── Dot grid ── */
    .terminal-dotgrid {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      animation: dotgrid-fade 0.8s var(--ease-smooth) 0.3s both;
      opacity: 0;
    }

    /* ════════════ TERMINAL CONTAINER ════════════ */
    .terminal {
      position: relative; z-index: 2;
      width: 100%; max-width: 600px;
      padding: 3rem 2.5rem;
      display: flex; flex-direction: column;
      gap: 2rem;
    }

    /* ── HUD Corner Brackets ── */
    .terminal::before,
    .terminal::after {
      content: ''; position: absolute; pointer-events: none;
      width: 24px; height: 24px; z-index: 3;
      opacity: 0;
      animation: bracket-appear 0.5s var(--ease-spring) 0.15s forwards;
    }
    .terminal::before {
      top: 0; left: 0;
      border-top: 1px solid rgba(245,158,11,0.2);
      border-left: 1px solid rgba(245,158,11,0.2);
    }
    .terminal::after {
      top: 0; right: 0;
      border-top: 1px solid rgba(245,158,11,0.2);
      border-right: 1px solid rgba(245,158,11,0.2);
    }

    .terminal-brackets-bottom {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
    }
    .terminal-brackets-bottom::before,
    .terminal-brackets-bottom::after {
      content: ''; position: absolute;
      width: 24px; height: 24px;
      opacity: 0;
      animation: bracket-appear 0.5s var(--ease-spring) 0.2s forwards;
    }
    .terminal-brackets-bottom::before {
      bottom: 0; left: 0;
      border-bottom: 1px solid rgba(245,158,11,0.2);
      border-left: 1px solid rgba(245,158,11,0.2);
    }
    .terminal-brackets-bottom::after {
      bottom: 0; right: 0;
      border-bottom: 1px solid rgba(245,158,11,0.2);
      border-right: 1px solid rgba(245,158,11,0.2);
    }

    /* ── Header ── */
    .terminal-header {
      display: flex; flex-direction: column;
      align-items: flex-start;
    }

    .terminal-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(44px, 7vw, 80px);
      letter-spacing: 0.14em;
      line-height: 0.9;
      color: var(--text-primary);
      text-transform: uppercase;
      display: flex;
      text-shadow: 0 0 40px var(--accent-glow);
      animation: title-glow-pulse 3s ease-in-out 1s infinite;
    }

    /* ── Title character stagger ── */
    .title-char {
      display: inline-block;
      opacity: 0;
      animation: char-drop-in 0.45s var(--ease-spring) forwards;
    }
    .title-char:nth-child(1) { animation-delay: 0.05s; }
    .title-char:nth-child(2) { animation-delay: 0.10s; }
    .title-char:nth-child(3) { animation-delay: 0.15s; }
    .title-char:nth-child(4) { animation-delay: 0.20s; }
    .title-char:nth-child(5) { animation-delay: 0.25s; }
    .title-char:nth-child(6) { animation-delay: 0.30s; }

    .terminal-rule {
      width: 180px; height: 2px;
      margin: 0.85rem 0 0.6rem;
      background: linear-gradient(to right, var(--accent), rgba(245,158,11,0.15), transparent);
      opacity: 0;
      animation: term-rule-expand 0.55s var(--ease-out) 0.35s forwards,
                 rule-breathe 2.5s ease-in-out 1s infinite;
      transform-origin: left center;
    }

    .terminal-subtitle {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      opacity: 0;
      animation: term-fade-up 0.45s var(--ease-smooth) 0.45s forwards;
      overflow: hidden;
      white-space: nowrap;
    }

    /* ── Subtitle typewriter reveal ── */
    .subtitle-text {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      animation: typewriter-reveal 1.2s steps(42, end) 0.5s forwards;
      max-width: 0;
      vertical-align: bottom;
    }

    /* ── Boot Log ── */
    .terminal-log {
      display: flex; flex-direction: column;
      gap: 0.55rem;
      font-size: 0.6rem;
      line-height: 1.7;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .log-row {
      display: flex; align-items: baseline; gap: 8px;
      opacity: 0;
      animation: log-entry-in 0.4s var(--ease-out) forwards;
      position: relative;
    }
    .log-row:nth-child(1) { animation-delay: 0.55s; }
    .log-row:nth-child(2) { animation-delay: 0.65s; }
    .log-row:nth-child(3) { animation-delay: 0.75s; }
    .log-row:nth-child(4) { animation-delay: 0.85s; }
    .log-row:nth-child(5) { animation-delay: 0.95s; }

    /* log caret */
    .log-row::before {
      content: '⟩';
      position: absolute; left: -14px; top: 0;
      font-size: 0.55rem; color: var(--accent-dim);
      opacity: 0;
      animation: caret-blink-in 0.5s var(--ease-smooth) forwards;
      animation-delay: inherit;
    }

    .log-status { color: var(--success); white-space: nowrap; font-weight: 500; }
    .log-entry  { color: var(--text-dim);  white-space: nowrap; }

    /* ── Progress Section ── */
    .terminal-progress {
      display: flex; flex-direction: column;
      gap: 0.5rem;
      opacity: 0;
      animation: term-fade-up 0.45s var(--ease-smooth) 0.55s forwards;
    }

    .progress-header {
      display: flex; align-items: baseline; justify-content: space-between;
    }

    .progress-stage {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 500;
    }

    .progress-pct {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .progress-pct-value {
      display: inline-block;
      transition: transform 0.15s var(--ease-spring);
    }

    .progress-track {
      width: 100%; height: 3px;
      background: var(--border-subtle);
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    }

    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent-dim), var(--accent));
      box-shadow: 0 0 14px var(--accent-glow);
      border-radius: 1px;
      transition: width 0.5s var(--ease-out);
      position: relative;
      animation: progress-glow-pulse 2s ease-in-out 0.8s infinite;
    }

    /* scan shimmer on progress bar */
    .progress-fill::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.12) 30%,
        transparent 60%
      );
      animation: term-shimmer 2.2s ease-in-out infinite;
    }

    .progress-detail {
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      min-height: 1.4em;
    }

    /* ── Prompt ── */
    .terminal-prompt {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.6rem; color: var(--accent);
      letter-spacing: 0.08em;
      opacity: 0;
      animation: term-fade-up 0.35s var(--ease-smooth) 0.9s forwards;
    }

    .cursor-blink {
      display: inline-block;
      width: 7px; height: 14px;
      background: var(--accent);
      animation: term-cursor 0.85s step-end infinite;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .prompt-label {
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* ── Footer ── */
    .terminal-footer {
      display: flex; justify-content: space-between;
      font-size: 0.48rem;
      color: var(--text-dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      animation: term-fade-up 0.35s var(--ease-smooth) 0.95s forwards;
    }

    .footer-left, .footer-right {
      display: flex; align-items: center; gap: 14px;
    }

    /* ── Status indicator dots ── */
    .status-dot {
      display: inline-block;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 4px;
      vertical-align: middle;
      box-shadow: 0 0 4px rgba(34,197,94,0.5);
      animation: status-dot-pulse 2s ease-in-out infinite;
    }
    .status-dot.amber {
      background: var(--accent);
      box-shadow: 0 0 4px var(--accent-glow);
      animation-delay: 0.3s;
    }
    .status-dot.standby {
      background: var(--accent-dim);
      box-shadow: 0 0 4px rgba(180,83,9,0.3);
      animation-delay: 0.7s;
    }

    /* ════════════ KEYFRAMES ════════════ */

    /* Character drop-in with bounce */
    @keyframes char-drop-in {
      0%   { opacity: 0; transform: translateY(-18px) scale(0.9); filter: blur(2px); }
      60%  { opacity: 1; transform: translateY(3px) scale(1.02); filter: blur(0); }
      80%  { transform: translateY(-1px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Title glow breathing */
    @keyframes title-glow-pulse {
      0%, 100% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(245,158,11,0.08); }
      50%      { text-shadow: 0 0 55px rgba(245,158,11,0.45), 0 0 100px rgba(245,158,11,0.12); }
    }

    /* Accent rule breathing */
    @keyframes rule-breathe {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1;   }
    }

    /* Typewriter reveal */
    @keyframes typewriter-reveal {
      from { max-width: 0; }
      to   { max-width: 100%; }
    }

    /* Log entry slide-in with accent flash */
    @keyframes log-entry-in {
      0%   { opacity: 0; transform: translateX(-8px); }
      60%  { opacity: 1; transform: translateX(1px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Caret blink-in for log entries */
    @keyframes caret-blink-in {
      0%, 40% { opacity: 0; }
      50%, 80% { opacity: 1; }
      90%, 100% { opacity: 0.15; }
    }

    /* HUD bracket appear */
    @keyframes bracket-appear {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1);   }
    }


    /* CRT flicker — subtle brightness oscillation */
    @keyframes crt-flicker {
      0%, 100%  { opacity: 1; }
      5%        { opacity: 0.985; }
      10%       { opacity: 1; }
      50%       { opacity: 0.995; }
      51%       { opacity: 1; }
      80%       { opacity: 0.99; }
      80.5%     { opacity: 1; }
    }

    /* Scanline drift */
    @keyframes scanline-drift {
      from { background-position: 0 0; }
      to   { background-position: 0 12px; }
    }

    /* Grain noise shift */
    @keyframes grain-shift {
      0%   { transform: translate(0, 0); }
      33%  { transform: translate(-1px, 1px); }
      66%  { transform: translate(1px, -1px); }
      100% { transform: translate(0, 0); }
    }

    /* Dotgrid fade-in */
    @keyframes dotgrid-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Progress bar glow pulse */
    @keyframes progress-glow-pulse {
      0%, 100% { box-shadow: 0 0 14px var(--accent-glow); }
      50%      { box-shadow: 0 0 20px rgba(245,158,11,0.45), 0 0 40px rgba(245,158,11,0.08); }
    }

    /* Status dot pulse */
    @keyframes status-dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.3); }
    }

    /* Standard animations */
    @keyframes term-fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes term-rule-expand {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @keyframes term-cursor {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    @keyframes term-shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%);  }
    }

    /* ════════════ RESPONSIVE ════════════ */
    @media (max-width: 768px) {
      .terminal {
        padding: 2rem 1.5rem;
        gap: 1.5rem;
        max-width: 100%;
      }
      .terminal-title {
        font-size: clamp(32px, 10vw, 48px);
        letter-spacing: 0.1em;
      }
      .terminal-rule {
        width: 120px;
        margin: 0.6rem 0 0.45rem;
      }
      .terminal-subtitle { font-size: 0.52rem; letter-spacing: 0.16em; }
      .terminal-log { gap: 0.4rem; font-size: 0.55rem; }
      .terminal-footer { flex-direction: column; gap: 4px; }
      .footer-left { gap: 10px; }

      /* Adjust corner brackets for tighter padding */
      .terminal::before, .terminal::after,
      .terminal-brackets-bottom::before,
      .terminal-brackets-bottom::after {
        width: 16px; height: 16px;
      }
      .log-row::before { left: -10px; font-size: 0.48rem; }
    }

    @media (max-width: 380px) {
      .terminal {
        padding: 1.5rem 1.25rem;
        gap: 1.25rem;
      }
      .terminal-title {
        font-size: clamp(28px, 11vw, 36px);
      }
      .log-row { gap: 5px; }
      .log-entry { font-size: 0.5rem; }
      .terminal::before, .terminal::after,
      .terminal-brackets-bottom::before,
      .terminal-brackets-bottom::after {
        width: 12px; height: 12px;
      }
      .log-row::before { display: none; }
    }

    /* ════════════ REDUCED MOTION ════════════ */
    @media (prefers-reduced-motion: reduce) {
      #loading-screen {
        transition: opacity 0.2s linear;
        animation: none;
      }
      #loading-screen::after {
        animation: none;
      }
      .terminal-grain { display: none; }
      .terminal-dotgrid { animation: none; opacity: 1; }

      /* Disable all entrance animations */
      .terminal-title,
      .terminal-rule,
      .terminal-subtitle,
      .log-row,
      .terminal-progress,
      .terminal-prompt,
      .terminal-footer {
        animation: none;
        opacity: 1;
      }
      .terminal-rule { transform: scaleX(1); }

      /* Character stagger → instant visible */
      .title-char {
        animation: none;
        opacity: 1;
        filter: none;
      }

      /* HUD brackets → instant */
      .terminal::before, .terminal::after,
      .terminal-brackets-bottom::before,
      .terminal-brackets-bottom::after {
        animation: none;
        opacity: 1;
      }

      /* Disable continuous animations */
      .cursor-blink { animation: none; opacity: 1; }
      .progress-fill { transition: width 0.1s linear; animation: none; }
      .progress-fill::after { animation: none; display: none; }
      .status-dot { animation: none; }
      .log-row::before { animation: none; opacity: 0.15; }
      .subtitle-text {
        animation: none;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- ═══════════════════════════ TERMINAL BOOT SCREEN ═══════════════════════════ -->
  <div id="loading-screen" role="status" aria-label="Loading application">
    <div class="terminal-grain" aria-hidden="true"></div>
    <div class="terminal-dotgrid" aria-hidden="true"></div>

    <div class="terminal">
      <div class="terminal-brackets-bottom" aria-hidden="true"></div>

      <!-- Header -->
      <header class="terminal-header">
        <h1 class="terminal-title">
          <span class="title-char">R</span><!--
       --><span class="title-char">W</span><!--
       --><span class="title-char">R</span><!--
       --><span class="title-char">O</span><!--
       --><span class="title-char">P</span><!--
       --><span class="title-char">S</span>
        </h1>
        <div class="terminal-rule" aria-hidden="true"></div>
        <p class="terminal-subtitle">
          <span class="subtitle-text">Running With Rifles · Tactical Data Terminal</span>
        </p>
      </header>

      <!-- Boot Log -->
      <div class="terminal-log" role="log" aria-label="System boot log">
        <div class="log-row">
          <span class="log-status">[&nbsp;OK&nbsp;]</span>
          <span class="log-entry" id="log-1">Initializing system…</span>
        </div>
        <div class="log-row">
          <span class="log-status">[&nbsp;OK&nbsp;]</span>
          <span class="log-entry" id="log-2">Loading metadata…</span>
        </div>
        <div class="log-row">
          <span class="log-status">[&nbsp;OK&nbsp;]</span>
          <span class="log-entry" id="log-3">Loading data package…</span>
        </div>
        <div class="log-row" id="log-4-row" style="display:none">
          <span class="log-status">[&nbsp;OK&nbsp;]</span>
          <span class="log-entry" id="log-4">Processing manifest…</span>
        </div>
        <div class="log-row" id="log-5-row" style="display:none">
          <span class="log-status">[&nbsp;OK&nbsp;]</span>
          <span class="log-entry" id="log-5">Manifest loaded</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="terminal-progress">
        <div class="progress-header">
          <span class="progress-stage" id="stage-text">INITIALIZING</span>
          <span class="progress-pct">
            <span class="progress-pct-value" id="ring-pct">0</span><span>%</span>
          </span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progress-bar" role="progressbar"
               aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="progress-detail" id="detail-text"></div>
      </div>

      <!-- Prompt -->
      <div class="terminal-prompt">
        <span class="cursor-blink" aria-hidden="true"></span>
        <span class="prompt-label" id="prompt-label">Awaiting initialization</span>
      </div>

      <!-- Footer -->
      <div class="terminal-footer" aria-hidden="true">
        <span class="footer-left">
          <span><span class="status-dot"></span>TERM v3.7</span>
          <span><span class="status-dot amber"></span>SECURE CHANNEL</span>
        </span>
        <span class="footer-right">
          <span><span class="status-dot standby"></span>STANDBY</span>
        </span>
      </div>
    </div>
  </div>

  <!-- React Mount -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
